name: Validate Kitachat

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax and dependency validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
        node-version: '20.x' # Diubah ke v20 agar mendukung package modern
        cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund # Menggunakan 'npm ci' lebih cepat & aman untuk CI/CD

      - name: Validate package scripts
        run: npm run check

      - name: Validate frontend JavaScript
        run: |
          STATUS=0
          echo "Checking public/app.js..." && node --check public/app.js || STATUS=1
          echo "Checking public/album-upload.js..." && node --check public/album-upload.js || STATUS=1
          echo "Checking public/ui-helpers.js..." && node --check public/ui-helpers.js || STATUS=1
          echo "Checking public/sw.js..." && node --check public/sw.js || STATUS=1
          exit $STATUS

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'));"
          node -e "JSON.parse(require('fs').readFileSync('public/manifest.json', 'utf8'));"

      - name: Validate database initializer
        run: node --check init-db.js
