name: Validate Kitachat

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax and dependency validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate package scripts
        run: |
          if npm run | grep -q "check"; then
            npm run check
          else
            echo "Skrip 'check' tidak ditemukan di package.json, melewati langkah ini..."
          fi

      - name: Validate JavaScript syntax
        run: |
          STATUS=0
          
          check_file() {
            if [ -f "$1" ]; then
              echo "Checking $1..."
              node --check "$1" || STATUS=1
            else
              echo "Peringatan: File $1 tidak ditemukan, melewati pengecekan."
            fi
          }

          # Sesuaikan path file dengan struktur repository Anda saat ini
          check_file "server.js"
          check_file "app.js"
          check_file "sw.js"
          
          exit $STATUS

      - name: Validate JSON files
        run: |
          node -e "
            const fs = require('fs');
            const checkJSON = (path) => {
              if (fs.existsSync(path)) {
                try {
                  JSON.parse(fs.readFileSync(path, 'utf8'));
                  console.log('✓ ' + path + ' valid');
                } catch (err) {
                  console.error('✗ ' + path + ' invalid JSON:', err.message);
                  process.exit(1);
                }
              } else {
                console.log('ℹ ' + path + ' tidak ditemukan (skip)');
              }
            };
            checkJSON('package.json');
            checkJSON('manifest.json');
          "
