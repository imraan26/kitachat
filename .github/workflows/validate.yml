name: Validate Kitachat

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax and dependency validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Periksa apakah skrip 'check' atau 'lint' ada di package.json sebelum dijalankan
      - name: Validate package scripts
        run: |
          if npm run | grep -q "check"; then
            npm run check
          else
            echo "Skrip 'check' tidak ditemukan di package.json, melewati langkah ini..."
          fi

      # Menggunakan ESLint (opsional namun direkomendasikan) ATAU mengecek file jika folder 'public' ada
      - name: Validate frontend JavaScript
        run: |
          STATUS=0
          
          # Fungsi pembantu untuk mengecek eksistensi file sebelum divalidasi
          check_file() {
            if [ -f "$1" ]; then
              echo "Checking $1..."
              node --check "$1" || STATUS=1
            else
              echo "Peringatan: File $1 tidak ditemukan, melewati pengecekan."
            fi
          }

          check_file "public/app.js"
          check_file "public/ui-helpers.js"
          check_file "public/sw.js"
          
          # Jika file ada di folder backend terpisah, buka tanda pagar di bawah ini:
          # check_file "server.js"
          
          exit $STATUS

      - name: Validate JSON files
        run: |
          node -e "
            const checkJSON = (path) => {
              if (require('fs').existsSync(path)) {
                JSON.parse(require('fs').readFileSync(path, 'utf8'));
                echo = console.log('✓ ' + path + ' valid');
              } else {
                console.log('ℹ ' + path + ' tidak ditemukan (skip)');
              }
            };
            checkJSON('package.json');
            checkJSON('public/manifest.json');
          "
